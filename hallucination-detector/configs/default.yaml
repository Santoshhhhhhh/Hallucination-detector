# Default configuration for the hallucination detection engine.
data:
  data_dir: data
  n_per_class: 200        # synthetic examples/class when RAGTruth unavailable
  seed: 7
  ratios: [0.7, 0.15, 0.15]

backend:
  kind: auto              # auto | mock | hf
  model_name: Qwen/Qwen2.5-3B
  dtype: bfloat16
  max_length: 2048
  mock_layers: 28
  mock_dim: 256

probe:
  C: 1.0
  seed: 7

output:
  out_dir: outputs
