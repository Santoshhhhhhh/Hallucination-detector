[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "halludetect"
version = "0.1.0"
description = "Three-class RAG hallucination detector via linear probing of a frozen 3B LLM"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "scikit-learn>=1.3", "joblib>=1.3", "pyyaml>=6.0"]

[project.optional-dependencies]
hf = ["torch>=2.1", "transformers>=4.44", "accelerate>=0.30", "datasets>=2.19"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
